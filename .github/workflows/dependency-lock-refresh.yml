name: Dependency Lock Refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.head_commit.message != 'chore(deps): refresh nonbreaking security lock'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Refresh vulnerable transitive dependencies without breaking upgrades
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts || true

      - name: Require no critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh nonbreaking security lock"
          git push origin HEAD:main
