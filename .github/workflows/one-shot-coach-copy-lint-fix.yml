name: One-shot coach copy lint fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-coach-copy-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix JSX copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/teams/[teamId].tsx')
          text = path.read_text()
          old = "the coach may view that athlete's team-context Track and Lift data"
          new = "the coach may view that athlete’s team-context Track and Lift data"
          if old not in text:
              raise SystemExit('expected copy not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "Amiri Prescod"
          git config user.email "presso1717@gmail.com"
          git rm .github/workflows/one-shot-coach-copy-lint-fix.yml
          git add 'app/teams/[teamId].tsx'
          git commit -m "fix(ui): clean coach responsibility copy"
          git push origin HEAD:main
