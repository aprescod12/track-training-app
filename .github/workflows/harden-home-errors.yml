name: Harden Home errors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harden-home-errors.yml"

permissions:
  contents: write

jobs:
  harden-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Sanitize Home user-visible errors
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/(tabs)/index.tsx")
          text = path.read_text()

          replacements = {
              '      setError("Not logged in");': '      setError("Please sign in again to continue.");',
              '      setError("Error: " + todayRes.error.message);': '      console.log("today workout error:", todayRes.error);\n      setError("Unable to load today\'s workout. Pull to refresh and try again.");',
              '      setError("Error: " + weekRes.error.message);': '      console.log("week workouts error:", weekRes.error);\n      setError("Unable to load this week\'s workouts. Pull to refresh and try again.");',
              '      setError("Error: " + distErr.message);': '      console.log("weekly totals error:", distErr);\n      setError("Unable to load weekly training totals. Pull to refresh and try again.");',
              '      setError("Error: " + exErr.message);': '      console.log("exercise options error:", exErr);\n      setError("Unable to load exercise options. Pull to refresh and try again.");',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Verify no raw Home backend errors remain
        run: |
          ! grep -n 'setError("Error: " +' 'app/(tabs)/index.tsx'
          ! grep -n 'setError("Not logged in")' 'app/(tabs)/index.tsx'
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Commit Home hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/index.tsx'
          git commit -m "fix(pilot): sanitize home load errors"
          git push origin HEAD:main
