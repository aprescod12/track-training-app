name: One-shot run home domain sweep

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-run-home-domain-sweep.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply home migration
        run: python3 scripts/field-home-domain-sweep.py
      - name: Verify migration
        run: |
          grep -q 'normalizeTrainingDomain' 'app/(tabs)/index.tsx'
          grep -q 'jumpWorkouts' 'app/(tabs)/index.tsx'
          grep -q 'TRAINING_DOMAINS.map' 'app/(tabs)/index.tsx'
          ! grep -q 'weeklyStats.trackWorkouts' 'app/(tabs)/index.tsx'
      - name: Commit migration and cleanup
        run: |
          git config user.name "Amiri Prescod"
          git config user.email "presso1717@gmail.com"
          git rm .github/workflows/one-shot-run-home-domain-sweep.yml scripts/field-home-domain-sweep.py
          git add 'app/(tabs)/index.tsx'
          git commit -m "feat(field): integrate home training domains"
          git push origin HEAD:main
