name: One-shot field domain integration repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-field-domain-integration.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate four-domain vocabulary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def require_replace(path, old, new, count=1):
              text = path.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"missing marker in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, count))

          # Legacy personal logger: it remains the Running/Lift editor, but uses
          # the new `running` database value and honors the domain chooser.
          modal = Path("app/modal.tsx")
          text = modal.read_text()
          text = text.replace('"track"', '"running"').replace("'track'", "'running'")
          text = text.replace("// track", "// running").replace("track-only", "running-only")
          text = text.replace("Track", "Running")
          old = '  const params = useLocalSearchParams<{ date?: string }>();'
          new = '  const params = useLocalSearchParams<{ date?: string; domain?: string }>();'
          if old not in text:
              raise SystemExit("modal params marker missing")
          text = text.replace(old, new, 1)
          old = '  const [workoutType, setWorkoutType] = useState<"running" | "lift">("running");'
          new = '  const requestedDomain = params.domain === "lift" ? "lift" : "running";\n  const [workoutType, setWorkoutType] = useState<"running" | "lift">(requestedDomain);'
          if old not in text:
              raise SystemExit("modal workout state marker missing")
          text = text.replace(old, new, 1)
          modal.write_text(text)

          # Team responsibility scopes become Running / Jumps / Throws / Lift.
          teams = Path("app/teams/[teamId].tsx")
          text = teams.read_text()
          old = '''const trainingScopes: { value: TrainingWorkoutType; label: string }[] = [
            { value: "track", label: "Track" },
            { value: "lift", label: "Lift" },
          ];'''
          new = '''const trainingScopes: { value: TrainingWorkoutType; label: string }[] = [
            { value: "running", label: "Running" },
            { value: "jumps", label: "Jumps" },
            { value: "throws", label: "Throws" },
            { value: "lift", label: "Lift" },
          ];'''
          if old not in text:
              raise SystemExit("team scope array marker missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              "Explicitly assigned coaches can still view both Track and Lift context for their athletes.",
              "Explicitly assigned coaches can still view all team-context training domains for their athletes.",
          )
          text = text.replace(
              "that athlete’s team-context Track and Lift data, but may only prescribe or formally review enabled domains.",
              "that athlete’s team-context Running, Jumps, Throws, and Lift data, but may only prescribe or formally review enabled domains.",
          )
          teams.write_text(text)

          # Assignment authoring shows the real domain rather than collapsing all
          # non-lift templates to Track.
          assign = Path("app/team-training/assign.tsx")
          text = assign.read_text()
          marker = '} from "../../lib/teams";\n'
          if marker not in text:
              raise SystemExit("assign import marker missing")
          text = text.replace(marker, marker + 'import { trainingDomainLabel } from "../../lib/trainingDomains";\n', 1)
          text = text.replace(
              "Assign only within your Track/Lift authority and only to athletes explicitly assigned to you.",
              "Assign only within your Running/Jumps/Throws/Lift authority and only to athletes explicitly assigned to you.",
          )
          old = '{template.workout_type === "lift" ? "Lift" : "Track"}'
          if old not in text:
              raise SystemExit("assign template label marker missing")
          text = text.replace(old, '{trainingDomainLabel(template.workout_type)}', 1)
          assign.write_text(text)

          # Assignment detail: field prescriptions, domain-matched attachment
          # candidates, and correct field-workout routes for athletes/coaches.
          detail = Path("app/team-training/assignment/[recipientId].tsx")
          text = detail.read_text()
          marker = '} from "../../../lib/assignmentAttachment";\n'
          if marker not in text:
              raise SystemExit("assignment detail import marker missing")
          text = text.replace(marker, marker + 'import { trainingDomainLabel } from "../../../lib/trainingDomains";\n', 1)
          old = '  if (entry.intensity_text) parts.push(entry.intensity_text);\n  return parts.join(" · ");'
          new = '  if (entry.intensity_text) parts.push(entry.intensity_text);\n  if (entry.attempts) parts.push(`${entry.attempts} attempts`);\n  if (entry.target_mark_m !== null) parts.push(`target ${entry.target_mark_m}m`);\n  if (entry.implement_weight_kg !== null) parts.push(`${entry.implement_weight_kg}kg implement`);\n  return parts.join(" · ");'
          if old not in text:
              raise SystemExit("prescription line marker missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '        setPersonalWorkouts(candidates);',
              '        setPersonalWorkouts(candidates.filter((candidate) => candidate.workout_type === own.workout_type_snapshot));',
              1,
          )
          old = '{row.team_name ?? "Team"} · {row.scheduled_date} · {row.workout_type_snapshot === "lift" ? "Lift" : "Track"}'
          if old not in text:
              raise SystemExit("assignment domain heading marker missing")
          text = text.replace(old, '{row.team_name ?? "Team"} · {row.scheduled_date} · {trainingDomainLabel(row.workout_type_snapshot)}', 1)
          old = '                onPress={() => router.push(`/modal?date=${athleteRow.scheduled_date}`)}'
          new = '''                onPress={() =>
                  router.push(
                    athleteRow.workout_type_snapshot === "jumps" || athleteRow.workout_type_snapshot === "throws"
                      ? (`/field-log?date=${athleteRow.scheduled_date}&domain=${athleteRow.workout_type_snapshot}` as any)
                      : (`/modal?date=${athleteRow.scheduled_date}&domain=${athleteRow.workout_type_snapshot}` as any)
                  )
                }'''
          if old not in text:
              raise SystemExit("assignment log route marker missing")
          text = text.replace(old, new, 1)
          old = '{workout.workout_type === "lift" ? "Lift" : "Track"} · currently personal'
          if old not in text:
              raise SystemExit("candidate domain marker missing")
          text = text.replace(old, '{trainingDomainLabel(workout.workout_type)} · currently personal', 1)
          old = '<PrimaryButton title="View linked workout" onPress={() => router.push(`/workout/${athleteRow.workout_id}`)} />'
          new = '<PrimaryButton title="View linked workout" onPress={() => router.push((athleteRow.workout_type_snapshot === "jumps" || athleteRow.workout_type_snapshot === "throws" ? `/field-workout/${athleteRow.workout_id}` : `/workout/${athleteRow.workout_id}`) as any)} />'
          if old not in text:
              raise SystemExit("athlete linked workout route marker missing")
          text = text.replace(old, new, 1)
          old = '<PrimaryButton title="View athlete performance" onPress={() => router.push(`/workout/${coachRow.workout_id}`)} />'
          new = '<PrimaryButton title="View athlete performance" onPress={() => router.push((coachRow.workout_type_snapshot === "jumps" || coachRow.workout_type_snapshot === "throws" ? `/field-workout/${coachRow.workout_id}` : `/workout/${coachRow.workout_id}`) as any)} />'
          if old not in text:
              raise SystemExit("coach linked workout route marker missing")
          text = text.replace(old, new, 1)
          old = 'You are assigned to this athlete, so you can see this {coachRow.workout_type_snapshot === "lift" ? "Lift" : "Track"} context.'
          if old not in text:
              raise SystemExit("view-only copy marker missing")
          text = text.replace(old, 'You are assigned to this athlete, so you can see this {trainingDomainLabel(coachRow.workout_type_snapshot)} context.', 1)
          detail.write_text(text)

          # Fresh database fixtures use the new Running domain. This does not
          # alter production data; the migration itself translates hosted Track
          # rows to Running when eventually deployed.
          for path in Path("supabase/tests/database").glob("*.sql"):
              text = path.read_text()
              text = text.replace("'track'", "'running'")
              path.write_text(text)
          PY

      - name: Verify domain integration edits
        run: |
          grep -q 'value: "jumps", label: "Jumps"' 'app/teams/[teamId].tsx'
          grep -q 'params.domain === "lift"' app/modal.tsx
          grep -q 'trainingDomainLabel(template.workout_type)' app/team-training/assign.tsx
          grep -q 'candidate.workout_type === own.workout_type_snapshot' 'app/team-training/assignment/[recipientId].tsx'
          if grep -R "'track'" supabase/tests/database/*.sql; then
            echo "Legacy track SQL literal remains in database tests" >&2
            exit 1
          fi

      - name: Commit integration and remove one-shot workflow
        run: |
          git config user.name "Amiri Prescod"
          git config user.email "presso1717@gmail.com"
          git rm .github/workflows/one-shot-field-domain-integration.yml
          git add app/modal.tsx 'app/teams/[teamId].tsx' app/team-training/assign.tsx 'app/team-training/assignment/[recipientId].tsx' supabase/tests/database/*.sql
          git commit -m "refactor(training): integrate four training domains"
          git push origin HEAD:main
