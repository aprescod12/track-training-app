name: One-shot final field validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-final-field-validation.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.114.0"

      - name: Narrow validated throw implement weight
        run: |
          test "$(grep -cF 'bestQuery.eq("implement_weight_kg", implementWeightKg)' app/field-log.tsx)" -eq 1
          sed -i 's/bestQuery.eq("implement_weight_kg", implementWeightKg)/bestQuery.eq("implement_weight_kg", implementWeightKg!)/' app/field-log.tsx
          test "$(grep -cF 'bestQuery.eq("implement_weight_kg", implementWeightKg!)' app/field-log.tsx)" -eq 1

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Validate Expo configuration
        run: npm run validate:expo

      - name: Production bundle export
        env:
          EXPO_PUBLIC_APP_ENV: local
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-key-placeholder
        run: npm run export:ci

      - name: Start local database and apply migrations
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --fail-on error

      - name: Run database authorization tests
        run: supabase test db

      - name: Commit validated fix and cleanup
        run: |
          rm .github/workflows/one-shot-final-field-validation.yml
          git config user.name "Amiri Prescod"
          git config user.email "presso1717@gmail.com"
          git add app/field-log.tsx .github/workflows/one-shot-final-field-validation.yml
          git commit -m "fix(field): narrow throw implement weight"
          git push
