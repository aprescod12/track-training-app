name: One-shot field CI cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-field-ci-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix field integration lint blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          calendar = Path('app/(tabs)/calendar.tsx')
          text = calendar.read_text()
          broken = '        </View>        </View>\n      </View>'
          fixed = '        </View>\n      </View>'
          if broken not in text:
              raise SystemExit('calendar closing-tag marker not found')
          calendar.write_text(text.replace(broken, fixed, 1))

          field = Path('app/field-log.tsx')
          text = field.read_text()
          misplaced = '\nconst fieldClient = supabase as any;\nimport {\n  JUMP_EVENTS,'
          ordered = '\nimport {\n  JUMP_EVENTS,'
          if misplaced not in text:
              raise SystemExit('field import-order marker not found')
          text = text.replace(misplaced, ordered, 1)
          marker = '} from "../lib/achievements";\n'
          if marker not in text:
              raise SystemExit('field client insertion marker not found')
          text = text.replace(marker, marker + '\nconst fieldClient = supabase as any;\n', 1)
          field.write_text(text)
          PY

      - name: Verify cleanup
        run: |
          ! grep -q '</View>        </View>' 'app/(tabs)/calendar.tsx'
          grep -q '^const fieldClient = supabase as any;' app/field-log.tsx

      - name: Commit cleanup
        run: |
          git config user.name "Amiri Prescod"
          git config user.email "presso1717@gmail.com"
          git rm .github/workflows/one-shot-field-ci-cleanup.yml
          git add 'app/(tabs)/calendar.tsx' app/field-log.tsx
          git commit -m "fix(field): clear integration CI blockers"
          git push origin HEAD:main
