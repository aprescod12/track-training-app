name: One-shot field performance surfaces

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-field-surface-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate four-domain performance surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # -----------------------------------------------------------------
          # Domain picker preserves an optional date through the chosen logger.
          # -----------------------------------------------------------------
          path = Path('app/workout/new.tsx')
          text = path.read_text()
          text = text.replace(
              'import { router } from "expo-router";',
              'import { router, useLocalSearchParams } from "expo-router";',
              1,
          )
          old = '''function hrefForDomain(domain: TrainingDomain) {
            if (domain === "jumps" || domain === "throws") {
              return `/field-log?domain=${domain}`;
            }
            return `/modal?domain=${domain}`;
          }'''
          new = '''function hrefForDomain(domain: TrainingDomain, date?: string) {
            const dateQuery = date ? `&date=${encodeURIComponent(date)}` : "";
            if (domain === "jumps" || domain === "throws") {
              return `/field-log?domain=${domain}${dateQuery}`;
            }
            return `/modal?domain=${domain}${dateQuery}`;
          }'''
          if old not in text:
              raise SystemExit('workout/new href marker missing')
          text = text.replace(old, new, 1)
          marker = '''export default function NewWorkoutDomainScreen() {
            const c = useAppColors();
          '''
          replacement = '''export default function NewWorkoutDomainScreen() {
            const c = useAppColors();
            const params = useLocalSearchParams<{ date?: string | string[] }>();
            const rawDate = Array.isArray(params.date) ? params.date[0] : params.date;
            const date = typeof rawDate === "string" ? rawDate : undefined;
          '''
          if marker not in text:
              raise SystemExit('workout/new component marker missing')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              'onPress={() => router.push(hrefForDomain(domain.value) as any)}',
              'onPress={() => router.push(hrefForDomain(domain.value, date) as any)}',
              1,
          )
          path.write_text(text)

          # -----------------------------------------------------------------
          # Home: all four domains, domain-aware details, and field attempts.
          # -----------------------------------------------------------------
          path = Path('app/(tabs)/index.tsx')
          text = path.read_text()
          marker = 'import { useAppColors } from "../../lib/theme";\n'
          if marker not in text:
              raise SystemExit('home theme import marker missing')
          text = text.replace(
              marker,
              marker + 'import { TRAINING_DOMAINS, normalizeTrainingDomain, trainingDomainLabel, type TrainingDomain } from "../../lib/trainingDomains";\n',
              1,
          )
          old = '''type Entry = {
            id: string;
            exercise_id: string | null;
            exercises?: { name: string } | null;
            exercise: string | null;
            reps: number | null;
            time: string | null;
            weight: number | null;
            notes: string | null;
          };'''
          new = '''type Entry = {
            id: string;
            exercise_id: string | null;
            exercises?: { name: string } | null;
            exercise: string | null;
            reps: number | null;
            time: string | null;
            weight: number | null;
            event_code: string | null;
            implement_weight_kg: number | null;
            notes: string | null;
            field_attempts?: { attempt_number: number; mark_m: number | null; outcome: string }[] | null;
          };'''
          if old not in text:
              raise SystemExit('home Entry type marker missing')
          text = text.replace(old, new, 1)
          text = text.replace('  workout_type: "track" | "lift";', '  workout_type: TrainingDomain | "track";', 1)

          marker = '''function ymdLocal(ts: string) {
            const d = new Date(ts);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
          }
          '''
          helper = '''function ymdLocal(ts: string) {
            const d = new Date(ts);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
          }

          function workoutHref(workout: Workout) {
            const domain = normalizeTrainingDomain(workout.workout_type);
            return domain === "jumps" || domain === "throws"
              ? `/field-workout/${workout.id}`
              : `/workout/${workout.id}`;
          }

          function trainingColor(c: ReturnType<typeof useAppColors>, domain: TrainingDomain) {
            if (domain === "jumps") return c.jumps;
            if (domain === "throws") return c.throws;
            if (domain === "lift") return c.lift;
            return c.running;
          }
          '''
          if marker not in text:
              raise SystemExit('home helper marker missing')
          text = text.replace(marker, helper, 1)

          old = '''  const [weeklyStats, setWeeklyStats] = useState({
            totalDistanceM: 0,
            trackWorkouts: 0,
            liftWorkouts: 0,
            liftSets: 0,
          });'''
          new = '''  const [weeklyStats, setWeeklyStats] = useState({
            totalDistanceM: 0,
            runningWorkouts: 0,
            jumpWorkouts: 0,
            throwWorkouts: 0,
            liftWorkouts: 0,
            liftSets: 0,
          });'''
          if old not in text:
              raise SystemExit('home weeklyStats marker missing')
          text = text.replace(old, new, 1)

          text = text.replace(
              '  const [featuredExercise, setFeaturedExercise] = useState<{ exercise_id: string; name: string } | null>(null);',
              '  const [featuredExercise, setFeaturedExercise] = useState<{ exercise_id: string; name: string; category: string | null } | null>(null);',
              1,
          )
          text = text.replace(
              '  const [allExercises, setAllExercises] = useState<{ exercise_id: string; name: string }[]>([]);',
              '  const [allExercises, setAllExercises] = useState<{ exercise_id: string; name: string; category: string | null }[]>([]);',
              1,
          )

          old = '''  const weekCounts = useMemo(() => {
            const map: Record<string, { track: number; lift: number; total: number }> = {};
            for (const w of weekWorkouts) {
              const key = w.workout_date;
              if (!map[key]) map[key] = { track: 0, lift: 0, total: 0 };
              map[key][w.workout_type] += 1;
              map[key].total += 1;
            }
            return map;
          }, [weekWorkouts]);'''
          new = '''  const weekCounts = useMemo(() => {
            const map: Record<
              string,
              { running: number; jumps: number; throws: number; lift: number; total: number }
            > = {};
            for (const w of weekWorkouts) {
              const key = w.workout_date;
              if (!map[key]) map[key] = { running: 0, jumps: 0, throws: 0, lift: 0, total: 0 };
              const domain = normalizeTrainingDomain(w.workout_type);
              map[key][domain] += 1;
              map[key].total += 1;
            }
            return map;
          }, [weekWorkouts]);'''
          if old not in text:
              raise SystemExit('home weekCounts marker missing')
          text = text.replace(old, new, 1)
          text = text.replace('  const dotTrack = c.dark ? "#34D399" : "green";\n  const dotLift = c.dark ? "#60A5FA" : "blue";\n\n', '', 1)

          old = '      setWeeklyStats({ totalDistanceM: 0, trackWorkouts: 0, liftWorkouts: 0, liftSets: 0 });'
          new = '      setWeeklyStats({ totalDistanceM: 0, runningWorkouts: 0, jumpWorkouts: 0, throwWorkouts: 0, liftWorkouts: 0, liftSets: 0 });'
          if old not in text:
              raise SystemExit('home reset stats marker missing')
          text = text.replace(old, new, 1)

          text = text.replace(
              'workout_entries(id, exercise_id, exercises(name), exercise, reps, time, weight, notes)',
              'workout_entries(id, exercise_id, exercises(name), exercise, reps, time, weight, event_code, implement_weight_kg, notes, field_attempts(attempt_number, mark_m, outcome))',
              1,
          )
          text = text.replace(
              '        entry_sets(set_number, rep_number, time_text, reps, weight)\n',
              '        entry_sets(set_number, rep_number, time_text, reps, weight),\n        field_attempts(attempt_number, mark_m, outcome)\n',
              1,
          )

          old = '''    const trackWorkouts = weekRows.filter((w: any) => w.workout_type === "track").length;
            const liftWorkouts = weekRows.filter((w: any) => w.workout_type === "lift").length;'''
          new = '''    const runningWorkouts = weekRows.filter((w: any) => normalizeTrainingDomain(w.workout_type) === "running").length;
            const jumpWorkouts = weekRows.filter((w: any) => normalizeTrainingDomain(w.workout_type) === "jumps").length;
            const throwWorkouts = weekRows.filter((w: any) => normalizeTrainingDomain(w.workout_type) === "throws").length;
            const liftWorkouts = weekRows.filter((w: any) => normalizeTrainingDomain(w.workout_type) === "lift").length;'''
          if old not in text:
              raise SystemExit('home weekly count marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '      if (r.workouts?.workout_type !== "track") return sum;',
              '      if (normalizeTrainingDomain(r.workouts?.workout_type) !== "running") return sum;',
              1,
          )
          old = '    setWeeklyStats({ totalDistanceM, trackWorkouts, liftWorkouts, liftSets });'
          new = '    setWeeklyStats({ totalDistanceM, runningWorkouts, jumpWorkouts, throwWorkouts, liftWorkouts, liftSets });'
          if old not in text:
              raise SystemExit('home set stats marker missing')
          text = text.replace(old, new, 1)
          text = text.replace('.select("exercise_id, name")', '.select("exercise_id, name, category")', 2)

          text = text.replace(
              '          <PrimaryButton title="Log" onPress={() => router.push(`/modal?date=${todayKey}`)} />',
              '          <PrimaryButton title="Log" onPress={() => router.push(`/workout/new?date=${todayKey}`)} />',
              1,
          )
          text = text.replace(
              '{todaysWorkout.workout_type === "track" ? "Track" : "Lift"} • {todaysWorkout.workout_date}',
              '{trainingDomainLabel(todaysWorkout.workout_type)} • {todaysWorkout.workout_date}',
              1,
          )

          old = '''                  {!!e.reps && <Text style={{ color: c.subtext }}>Reps: {e.reps}</Text>}
                  {!!e.time && <Text style={{ color: c.subtext }}>Time: {e.time}</Text>}
                  {e.weight !== null && <Text style={{ color: c.subtext }}>Weight: {e.weight}</Text>}
                  {!!e.notes && <Text style={{ color: c.subtext }}>{e.notes}</Text>}'''
          new = '''                  {e.implement_weight_kg != null && (
                    <Text style={{ color: c.subtext }}>Implement: {e.implement_weight_kg} kg</Text>
                  )}
                  {(e.field_attempts?.length ?? 0) > 0 ? (
                    <Text style={{ color: c.subtext }}>Attempts: {e.field_attempts?.length}</Text>
                  ) : (
                    <>
                      {!!e.reps && <Text style={{ color: c.subtext }}>Reps: {e.reps}</Text>}
                      {!!e.time && <Text style={{ color: c.subtext }}>Time: {e.time}</Text>}
                      {e.weight !== null && <Text style={{ color: c.subtext }}>Weight: {e.weight}</Text>}
                    </>
                  )}
                  {!!e.notes && <Text style={{ color: c.subtext }}>{e.notes}</Text>}'''
          if old not in text:
              raise SystemExit('home today entry marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '            <Pressable onPress={() => router.push(`/workout/${todaysWorkout.id}`)}>',
              '            <Pressable onPress={() => router.push(workoutHref(todaysWorkout) as any)}>',
              1,
          )
          text = text.replace(
              '{weeklyStats.trackWorkouts + weeklyStats.liftWorkouts}',
              '{weeklyStats.runningWorkouts + weeklyStats.jumpWorkouts + weeklyStats.throwWorkouts + weeklyStats.liftWorkouts}',
              1,
          )
          old = '''            <Text style={{ color: c.subtext }}>Lifts</Text>
            <Text style={{ fontSize: 18, fontWeight: "900", color: c.text }}>{weeklyStats.liftWorkouts}</Text>'''
          new = '''            <Text style={{ color: c.subtext }}>Field / Lift</Text>
            <Text style={{ fontSize: 18, fontWeight: "900", color: c.text }}>
              {weeklyStats.jumpWorkouts + weeklyStats.throwWorkouts} / {weeklyStats.liftWorkouts}
            </Text>
            <Text style={{ color: c.subtext, fontSize: 11 }}>sessions</Text>'''
          if old not in text:
              raise SystemExit('home lift card marker missing')
          text = text.replace(old, new, 1)

          text = text.replace(
              '                const isLift = r.workouts?.workout_type === "lift";\n',
              '                const workoutDomain = normalizeTrainingDomain(r.workouts?.workout_type);\n                const isLift = workoutDomain === "lift";\n                const isField = workoutDomain === "jumps" || workoutDomain === "throws";\n',
              1,
          )
          old = '''                      const sets = (r.entry_sets ?? []) as Array<{
                        set_number: number;
                        rep_number: number | null;
                        time_text: string | null;
                        reps: number | null;
                        weight: number | null;
                      }>;

                      if (!sets.length) {
                        return <Text style={{ color: c.subtext }}>No sets recorded.</Text>;
                      }'''
          new = '''                      if (isField) {
                        const attempts = [...(r.field_attempts ?? [])].sort(
                          (a: any, b: any) => Number(a.attempt_number) - Number(b.attempt_number)
                        );
                        if (!attempts.length) {
                          return <Text style={{ color: c.subtext }}>No attempts recorded.</Text>;
                        }
                        return attempts.slice(0, 6).map((attempt: any) => (
                          <Text key={attempt.attempt_number} style={{ color: c.subtext }} numberOfLines={1}>
                            Attempt {attempt.attempt_number}: {attempt.mark_m != null ? `${Number(attempt.mark_m).toFixed(2)} m` : "—"} · {attempt.outcome}
                          </Text>
                        ));
                      }

                      const sets = (r.entry_sets ?? []) as {
                        set_number: number;
                        rep_number: number | null;
                        time_text: string | null;
                        reps: number | null;
                        weight: number | null;
                      }[];

                      if (!sets.length) {
                        return <Text style={{ color: c.subtext }}>No sets recorded.</Text>;
                      }'''
          if old not in text:
              raise SystemExit('home featured sets marker missing')
          text = text.replace(old, new, 1)

          old = '''              <Pressable onPress={() => router.push(`/history/${featuredExercise.exercise_id}`)}>
                <Text style={{ color: c.subtext, fontWeight: "800" }}>History</Text>
              </Pressable>'''
          new = '''              <Pressable
                onPress={() =>
                  router.push(
                    (featuredExercise.category === "jumps" || featuredExercise.category === "throws"
                      ? `/profile/field-stats?domain=${featuredExercise.category}`
                      : `/history/${featuredExercise.exercise_id}`) as any
                  )
                }
              >
                <Text style={{ color: c.subtext, fontWeight: "800" }}>
                  {featuredExercise.category === "jumps" || featuredExercise.category === "throws"
                    ? "Field stats"
                    : "History"}
                </Text>
              </Pressable>'''
          if old not in text:
              raise SystemExit('home featured history marker missing')
          text = text.replace(old, new, 1)

          old = '''            const trackCount = counts?.track ?? 0;
            const liftCount = counts?.lift ?? 0;
            const total = counts?.total ?? 0;'''
          new = '''            const total = counts?.total ?? 0;'''
          if old not in text:
              raise SystemExit('home weekly calendar count vars missing')
          text = text.replace(old, new, 1)
          start = text.index('                {total > 0 && (')
          end_marker = '                )}\n              </Pressable>'
          end = text.index(end_marker, start)
          replacement = '''                {total > 0 && (
                  <View style={{ marginTop: 4, flexDirection: "row", gap: 3, alignItems: "center" }}>
                    {TRAINING_DOMAINS.map((domain) =>
                      (counts?.[domain.value] ?? 0) > 0 ? (
                        <View
                          key={domain.value}
                          style={{
                            width: 6,
                            height: 6,
                            borderRadius: 999,
                            backgroundColor: trainingColor(c, domain.value),
                          }}
                        />
                      ) : null
                    )}
                  </View>
                )}'''
          text = text[:start] + replacement + text[end + len('                )}'):]
          path.write_text(text)

          # -----------------------------------------------------------------
          # Running Stats: keep the route, update domain semantics.
          # -----------------------------------------------------------------
          path = Path('app/profile/track-stats.tsx')
          text = path.read_text()
          text = text.replace('TrackWorkoutRow', 'RunningWorkoutRow')
          text = text.replace('TrackStatsScreen', 'RunningStatsScreen')
          text = text.replace('trackWorkouts', 'runningWorkouts')
          text = text.replace('track PR count query skipped:', 'running PR count query skipped:')
          text = text.replace('Failed to load track stats', 'Failed to load running stats')
          text = text.replace('Loading track stats…', 'Loading running stats…')
          text = text.replace('Track Stats', 'Running Stats')
          text = text.replace('Track sessions', 'Running sessions')
          text = text.replace('.eq("workout_type", "track")', '.in("workout_type", ["running", "track"])')
          text = text.replace('.eq("workouts.workout_type", "track")', '.in("workouts.workout_type", ["running", "track"])')
          path.write_text(text)

          # -----------------------------------------------------------------
          # Profile: four-domain focus counts; Running owns distance.
          # -----------------------------------------------------------------
          path = Path('app/(tabs)/profile.tsx')
          text = path.read_text()
          marker = 'import { toAppError } from "../../lib/errors";\n'
          if marker not in text:
              raise SystemExit('profile import marker missing')
          text = text.replace(marker, marker + 'import { normalizeTrainingDomain } from "../../lib/trainingDomains";\n', 1)
          text = text.replace('    trackWorkouts: 0,', '    runningWorkouts: 0,\n    jumpWorkouts: 0,\n    throwWorkouts: 0,', 1)
          text = text.replace('          trackWorkouts: 0,', '          runningWorkouts: 0,\n          jumpWorkouts: 0,\n          throwWorkouts: 0,', 2)
          old = '''      const trackWorkouts = (workoutRows ?? []).filter((w) => w.workout_type === "track").length;
            const liftWorkouts = (workoutRows ?? []).filter((w) => w.workout_type === "lift").length;'''
          new = '''      const runningWorkouts = (workoutRows ?? []).filter((w) => normalizeTrainingDomain(w.workout_type) === "running").length;
            const jumpWorkouts = (workoutRows ?? []).filter((w) => normalizeTrainingDomain(w.workout_type) === "jumps").length;
            const throwWorkouts = (workoutRows ?? []).filter((w) => normalizeTrainingDomain(w.workout_type) === "throws").length;
            const liftWorkouts = (workoutRows ?? []).filter((w) => normalizeTrainingDomain(w.workout_type) === "lift").length;'''
          if old not in text:
              raise SystemExit('profile count marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '        if (r.workouts?.workout_type !== "track") return sum;',
              '        if (normalizeTrainingDomain(r.workouts?.workout_type) !== "running") return sum;',
              1,
          )
          text = text.replace('        trackWorkouts,\n        liftWorkouts,', '        runningWorkouts,\n        jumpWorkouts,\n        throwWorkouts,\n        liftWorkouts,', 1)
          text = text.replace('sublabel="Track distance total"', 'sublabel="Running distance total"', 1)
          old = '''            <View style={{ flexDirection: "row", gap: 10 }}>
              <StatTile
                label="Track Focus"
                value={stats.trackWorkouts}
                sublabel={
                  stats.totalWorkouts > 0
                    ? `${Math.round((stats.trackWorkouts / stats.totalWorkouts) * 100)}% of workouts`
                    : "No workouts yet"
                }
                onPress={() => router.push("/profile/track-stats")}
              />
              <StatTile
                label="Lift Focus"
                value={stats.liftWorkouts}
                sublabel={
                  stats.totalWorkouts > 0
                    ? `${Math.round((stats.liftWorkouts / stats.totalWorkouts) * 100)}% of workouts`
                    : "No workouts yet"
                }
                onPress={() => router.push("/profile/lift-stats")}
              />
            </View>'''
          new = '''            <>
              <View style={{ flexDirection: "row", gap: 10 }}>
                <StatTile
                  label="Running"
                  value={stats.runningWorkouts}
                  sublabel={stats.totalWorkouts > 0 ? `${Math.round((stats.runningWorkouts / stats.totalWorkouts) * 100)}% of workouts` : "No workouts yet"}
                  onPress={() => router.push("/profile/track-stats")}
                />
                <StatTile
                  label="Jumps"
                  value={stats.jumpWorkouts}
                  sublabel={stats.totalWorkouts > 0 ? `${Math.round((stats.jumpWorkouts / stats.totalWorkouts) * 100)}% of workouts` : "No workouts yet"}
                  onPress={() => router.push("/profile/field-stats?domain=jumps")}
                />
              </View>
              <View style={{ flexDirection: "row", gap: 10, marginTop: 10 }}>
                <StatTile
                  label="Throws"
                  value={stats.throwWorkouts}
                  sublabel={stats.totalWorkouts > 0 ? `${Math.round((stats.throwWorkouts / stats.totalWorkouts) * 100)}% of workouts` : "No workouts yet"}
                  onPress={() => router.push("/profile/field-stats?domain=throws")}
                />
                <StatTile
                  label="Lift"
                  value={stats.liftWorkouts}
                  sublabel={stats.totalWorkouts > 0 ? `${Math.round((stats.liftWorkouts / stats.totalWorkouts) * 100)}% of workouts` : "No workouts yet"}
                  onPress={() => router.push("/profile/lift-stats")}
                />
              </View>
            </>'''
          if old not in text:
              raise SystemExit('profile performance marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # -----------------------------------------------------------------
          # Overview: migrate Track semantics to Running then add field split.
          # -----------------------------------------------------------------
          path = Path('app/profile/overview.tsx')
          text = path.read_text()
          marker = 'import { formatYMD } from "../../lib/date";\n'
          if marker not in text:
              raise SystemExit('overview import marker missing')
          text = text.replace(
              marker,
              marker + 'import { normalizeTrainingDomain, trainingDomainLabel, type TrainingDomain } from "../../lib/trainingDomains";\n',
              1,
          )
          text = text.replace('"track" | "lift" | string', 'TrainingDomain | "track" | string')
          text = text.replace('allTimeTrack', 'allTimeRunning')
          text = text.replace('weekTrack', 'weekRunning')
          text = text.replace('monthTrack', 'monthRunning')
          text = text.replace('trackPct', 'runningPct')
          text = text.replace('Track Stats', 'Running Stats')
          text = text.replace('Track distance', 'Running distance')
          text = text.replace('track •', 'running •')
          text = text.replace('/profile/running-stats', '/profile/track-stats')

          # Add field count properties to each stats object shape.
          text = text.replace('    allTimeRunning: 0,\n    allTimeLift: 0,', '    allTimeRunning: 0,\n    allTimeJumps: 0,\n    allTimeThrows: 0,\n    allTimeLift: 0,', 1)
          text = text.replace('    weekRunning: 0,\n    weekLift: 0,', '    weekRunning: 0,\n    weekJumps: 0,\n    weekThrows: 0,\n    weekLift: 0,', 1)
          text = text.replace('    monthRunning: 0,\n    monthLift: 0,', '    monthRunning: 0,\n    monthJumps: 0,\n    monthThrows: 0,\n    monthLift: 0,', 1)
          text = text.replace('          allTimeRunning: 0,\n          allTimeLift: 0,', '          allTimeRunning: 0,\n          allTimeJumps: 0,\n          allTimeThrows: 0,\n          allTimeLift: 0,', 1)
          text = text.replace('          weekRunning: 0,\n          weekLift: 0,', '          weekRunning: 0,\n          weekJumps: 0,\n          weekThrows: 0,\n          weekLift: 0,', 1)
          text = text.replace('          monthRunning: 0,\n          monthLift: 0,', '          monthRunning: 0,\n          monthJumps: 0,\n          monthThrows: 0,\n          monthLift: 0,', 1)

          old = '''      const allTimeRunning = workouts.filter((w) => w.workout_type === "track").length;
            const allTimeLift = workouts.filter((w) => w.workout_type === "lift").length;'''
          new = '''      const allTimeRunning = workouts.filter((w) => normalizeTrainingDomain(w.workout_type) === "running").length;
            const allTimeJumps = workouts.filter((w) => normalizeTrainingDomain(w.workout_type) === "jumps").length;
            const allTimeThrows = workouts.filter((w) => normalizeTrainingDomain(w.workout_type) === "throws").length;
            const allTimeLift = workouts.filter((w) => normalizeTrainingDomain(w.workout_type) === "lift").length;'''
          if old not in text:
              raise SystemExit('overview all-time count marker missing')
          text = text.replace(old, new, 1)
          old = '''      const weekRunning = weekRows.filter((w) => w.workout_type === "track").length;
            const weekLift = weekRows.filter((w) => w.workout_type === "lift").length;
