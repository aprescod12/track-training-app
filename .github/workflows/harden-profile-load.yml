name: Harden Profile load

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harden-profile-load.yml"

permissions:
  contents: write

jobs:
  harden-profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Remove duplicate Profile load and sanitize errors
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/(tabs)/profile.tsx")
          text = path.read_text()

          replacements = [
              (
                  'import { useEffect, useState, useCallback } from "react";',
                  'import { useState, useCallback } from "react";'
              ),
              (
                  'import Avatar from "../../components/Avatar";',
                  'import Avatar from "../../components/Avatar";\nimport { toAppError } from "../../lib/errors";'
              ),
              (
                  '''    } catch (e: any) {\n      Alert.alert("Profile error", e?.message ?? "Failed to load profile");\n      setProfile(null);\n    } finally {''',
                  '''    } catch (e: unknown) {\n      const appError = toAppError(e, {\n        fallbackMessage: "Could not load your profile. Please try again.",\n      });\n      Alert.alert("Profile error", appError.message);\n      setProfile(null);\n    } finally {'''
              ),
              (
                  '        setStatus("Not logged in");',
                  '        setStatus("Please sign in again");'
              ),
              (
                  '''    } catch (e: any) {\n      Alert.alert("Stats error", e?.message ?? "Failed to load stats");\n      setStats({''',
                  '''    } catch (e: unknown) {\n      const appError = toAppError(e, {\n        fallbackMessage: "Could not load your training stats. Pull to refresh and try again.",\n      });\n      Alert.alert("Stats error", appError.message);\n      setStats({'''
              ),
              (
                  '''  useEffect(() => {\n    loadAll();\n  }, [loadAll]);\n\n''',
                  ''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Verify Profile hardening
        run: |
          ! grep -n 'useEffect' 'app/(tabs)/profile.tsx'
          ! grep -n 'catch (e: any)' 'app/(tabs)/profile.tsx'
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Commit Profile hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/profile.tsx'
          git commit -m "fix(pilot): stabilize profile loading"
          git push origin HEAD:main
